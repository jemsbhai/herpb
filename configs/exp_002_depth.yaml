# EXP-002: Homomorphic Depth Benchmark
# Frozen copy — do not edit after experiment starts.

experiment:
  name: "exp_002_depth"
  description: "Homomorphic depth benchmark for RPB and MRPB"
  id: "EXP-002"

seed: 42

# Depths to test (powers of 2)
depths: [1, 2, 4, 8, 16, 32, 64]

# Trials per depth per circuit type
trials_per_depth: 100

# Circuit types to test
circuits:
  - "multiply_chain"    # depth sequential multiplications
  - "add_chain"         # depth sequential additions
  - "mixed_alt"         # alternating add/multiply

# RPB parameters
rpb:
  c_value: 7
  t_value: 2

# MRPB parameters
mrpb:
  key_bits: 2048
  precision: 2

# Operand pool: small rationals to allow deep circuits
# Each entry is [a_num, a_den, b_num, b_den] -> ratio a/b
operand_pool:
  - [1, 1, 2, 1]    # 1/2
  - [1, 1, 3, 1]    # 1/3
  - [2, 1, 3, 1]    # 2/3
  - [3, 1, 4, 1]    # 3/4
  - [3, 1, 5, 1]    # 3/5
  - [2, 1, 5, 1]    # 2/5
  - [5, 1, 7, 1]    # 5/7
  - [4, 1, 9, 1]    # 4/9

output_dir: "experiments/exp_002_depth"
